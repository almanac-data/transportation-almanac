notes: |
  Human-verified 2026-10-31: HTTP 200. The page shows a national time series back to 1993 and offers downloads of "street-level traffic figures for all regions, local authorities and count point locations", including annual average daily flow (overall and by direction) and raw counts. It links an API and states "All content is available under the Open Government Licence v3.0, except where otherwise stated". Coverage is Great Britain, not Northern Ireland. Two things come from DfT's usual practice and weren't checked: the annual cadence and the csv format. The DfT publisher name is taken from the service's own branding.
