notes: |
  Human-verified 2026-10-31: HTTP 200. The page says "The NTSB aviation accident database contains civil aviation accidents and selected incidents that occurred from 1962 to present within the United States, its territories and possessions, and in international waters." NTSB's newer CAROL search lives at data.ntsb.gov, which redirects to my.ntsb.gov/basic. The download formats are assumed from NTSB's usual distribution and weren't checked. Records are added as investigations progress, so cadence is event.
