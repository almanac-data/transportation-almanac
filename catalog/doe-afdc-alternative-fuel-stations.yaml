id: doe-afdc-alternative-fuel-stations
type: dataset
title: DOE Alternative Fuels Data Center — Alternative Fuel Stations Data
description: |
  The U.S. Department of Energy's database of public and private alternative fuel stations in the United States and Canada (EV charging, biodiesel, CNG, E85, hydrogen, LNG, propane, renewable diesel). It powers the AFDC Station Locator and is offered as a bulk download and through an API, with historical station data.
