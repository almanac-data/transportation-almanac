id: fta-national-transit-database
type: dataset
title: FTA National Transit Database (NTD)
description: |
  The Federal Transit Administration's National Transit Database: ridership, service, operating and capital expenses, funding sources, fares, vehicles and energy, stations, facilities, track and employees reported by U.S. transit agencies, with monthly ridership and annual data tables. This entry points at the NTD datasets FTA publishes on DOT's open data portal.
publisher: U.S. Department of Transportation, Federal Transit Administration (FTA)
