notes: |
  Human-verified 2026-11-01: HTTP 200 (curl; the catalog page was read in headless Chromium). FTA's own NTD page, https://www.transit.dot.gov/ntd, still returned Akamai "Access Denied" (HTTP 403) to curl and headless Chromium. Following the workaround in the issue, this entry points at the DOT DataHub catalog search for NTD in the Public Transit category, which showed "149 results". The search URL may be less stable than a single dataset page. Through the Socrata catalog API, the most recently updated ones are "2025 NTD Annual Data - Demand Response Geographic Area Coverage" (2026-10-29), a set of 2025 annual summaries (service, metrics, funding sources, capital expenses, vehicles and energy; mid-October 2026), and "Complete Monthly Ridership (with Adjustments and Estimates)" (https://data.transportation.gov/d/8bui-9xvu, updated 2026-10-01). Dataset descriptions say they are based on the database files "on NTD Program website, at https://transit.dot.gov/ntd/ntd-data". The parent portal is catalogued separately as us-dot-open-data-portal. Formats are the standard Socrata exports and weren't tested.
  Licence checked 2026-11-01: DOT DataHub metadata for the NTD datasets (for example, 8bui-9xvu) gives licence "Public Domain U.S. Government" with terms link https://www.usa.gov/government-works and attribution "Federal Transit Administration". A few NTD tables (for example, "2025 NTD Annual Data Summary - Transit Passenger Fares") have no licence set in the catalog.
