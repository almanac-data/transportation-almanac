notes: |
  Human-verified 2026-10-31: HTTP 200 ("Last update: Friday, October 30, 2026"). The page announces a new FRA safety data page, released in December 2024, with "reports, full datasets, and PDF reports for train accident, highway-rail crossing incident, highway-rail crossing inventory, casualty, and operational data". It lists Full Datasets and Data Downloads for each category. The FRA main site (railroads.dot.gov) returned 403 to curl. The monthly cadence and the csv format are assumed and weren't checked. A steward may want to repoint canonical_url to the new safety data page.
