notes: |
  Human-verified 2026-10-31: HTTP 200. The page states "Data are available from January 1995 through August 2026" and documents carrier merger reporting changes. Three things come from TranStats' usual practice and weren't checked here: flight-level detail, the monthly cadence, and CSV downloads. TranStats (https://www.transtats.bts.gov/) is reachable, but several www.bts.gov pages, such as the Freight Analysis Framework, returned Access Denied to both curl and headless Chromium this session.
