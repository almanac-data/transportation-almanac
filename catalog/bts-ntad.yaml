id: bts-ntad
type: dataset
title: BTS National Transportation Atlas Database (NTAD)
description: |
  The National Transportation Atlas Database is BTS's collection of national geospatial datasets: transportation facilities and networks for every mode (aviation, maritime, rail, roads, transit), flows over those networks, and related boundary, energy, environment, performance and safety layers. Each dataset is offered as a download and as a web service.
publisher: U.S. Department of Transportation, Bureau of Transportation Statistics (BTS), with other DOT operating administrations
