notes: |
  Human-verified 2026-10-31: HTTP 200. The page shows featured datasets (border crossing data, Takata recall priority groups) and links to the Socrata Terms of Use. It is a portal, not one dataset, so it's cataloged as a gateway; individual DOT datasets deserve their own entries. Some DOT bureau sites returned Access Denied to both curl and headless Chromium this session (NHTSA FARS, the FTA National Transit Database, BTS freight pages), and this portal may be the most reliable programmatic route to some of their data. The license is marked dataset-dependent because individual datasets can carry their own terms.
