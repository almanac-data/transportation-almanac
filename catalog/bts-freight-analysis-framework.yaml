id: bts-freight-analysis-framework
type: dataset
title: BTS/FHWA Freight Analysis Framework (FAF5)
description: |
  The Freight Analysis Framework estimates U.S. freight movement among states and major metropolitan areas by all modes: tonnage, value and ton-miles by origin-destination region, commodity and mode, for a 2017 base year, recent years, forecasts to 2050 and state-level historical trends. It is built from the Commodity Flow Survey and Census international trade data, among other sources.
