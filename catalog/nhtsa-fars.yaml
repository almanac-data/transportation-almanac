title: NHTSA Fatality Analysis Reporting System (FARS)
description: |
  A nationwide census of fatal U.S. motor vehicle crashes: every crash on a public trafficway resulting in a death within 30 days, with more than 100 coded data elements describing the crash, vehicles, and people involved.
