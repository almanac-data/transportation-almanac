notes: |
  Human-verified 2026-10-31 in headless Chromium on the DOT DataHub. The URL redirects to /Automobiles/Fatality-Analysis-Reporting-System-FARS-/mzrg-xkip/about_data. The page describes a crash qualifying when it "must involve a motor vehicle traveling a traffic-way customarily open to the public and resulting in the death of a person ... within 30 days", and "Each crash has more than 100 coded data elements". DOT DataHub also lists a FARS online query tool (d/vzqv-j5g4) and FTP raw data (d/kcpj-k9k9). NHTSA's own FARS page (www.nhtsa.gov) returned Access Denied to curl and headless Chromium this session, which is why this entry points at DataHub. Not checked: the 1975 start year, the Puerto Rico coverage, and the formats.
