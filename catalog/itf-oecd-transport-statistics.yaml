title: International Transport Forum (ITF) Transport Statistics
description: |
  The International Transport Forum's transport statistics, published through the OECD Data Explorer: annual transport trends (freight, passenger, container, infrastructure length, road fatalities), short-term transport indicators, transport performance indicators, and infrastructure investment and maintenance spending, collected from transport ministries and statistical offices of ITF member countries.
